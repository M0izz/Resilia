version: "3.9"

services:
  # ─── DynamoDB Local ────────────────────────────────────────────────────────
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: resilia-dynamodb
    ports:
      - "8001:8000"
    command: "-jar DynamoDBLocal.jar -sharedDb"
    volumes:
      - dynamodb-data:/home/dynamodblocal/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── FastAPI Backend ───────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resilia-backend
    ports:
      - "8000:8000"
    environment:
      - DYNAMODB_ENDPOINT=http://dynamodb-local:8000
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=local
      - AWS_SECRET_ACCESS_KEY=local
      - ENVIRONMENT=local
    depends_on:
      dynamodb-local:
        condition: service_healthy
    volumes:
      - ./backend:/app
    restart: unless-stopped

  # ─── Streamlit Dashboard ───────────────────────────────────────────────────
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: resilia-dashboard
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://backend:8000
    depends_on:
      - backend
    volumes:
      - ./dashboard:/app
    restart: unless-stopped

  # ─── One-shot seed runner (docker compose run seed) ───────────────────────
  seed:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resilia-seed
    environment:
      - DYNAMODB_ENDPOINT=http://dynamodb-local:8000
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=local
      - AWS_SECRET_ACCESS_KEY=local
      - ENVIRONMENT=local
      - PYTHONPATH=/app
    depends_on:
      dynamodb-local:
        condition: service_healthy
    command: python /seed/seed_db.py
    volumes:
      - ./backend:/app
      - ./data:/seed
    profiles:
      - seed

volumes:
  dynamodb-data:
