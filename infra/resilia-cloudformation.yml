AWSTemplateFormatVersion: '2010-09-09'
Description: >
  RESILIA — National Healthcare Supply-Chain Resilience Platform.
  Production AWS CloudFormation Template deploying Amazon API Gateway, ECS Fargate,
  DynamoDB, EventBridge, Step Functions, OpenSearch, S3, Cognito, and Amazon Bedrock integration.

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues: [dev, staging, prod]
    Description: Deployment target environment.

  BedrockModelId:
    Type: String
    Default: anthropic.claude-3-5-sonnet-20241022-v2:0
    Description: Amazon Bedrock Foundation Model ID for Agentic Reasoning.

Resources:

  # ─── 1. S3 BUCKET FOR AUDIT & MODEL WEIGHTS ──────────────────────────────
  ResiliaModelArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub resilia-artifacts-${AWS::AccountId}-${AWS::Region}-${Environment}
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # ─── 2. DYNAMODB OPERATIONAL DATA TABLES ─────────────────────────────────
  PhcNetworkTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub Resilia-PHCs-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: phc_id
          AttributeType: S
        - AttributeName: district_code
          AttributeType: S
      KeySchema:
        - AttributeName: phc_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: DistrictIndex
          KeySchema:
            - AttributeName: district_code
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  InventoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub Resilia-Inventory-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: phc_id
          AttributeType: S
        - AttributeName: medicine_code
          AttributeType: S
      KeySchema:
        - AttributeName: phc_id
          KeyType: HASH
        - AttributeName: medicine_code
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  AuditLedgerTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub Resilia-AuditLedger-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: audit_id
          AttributeType: S
        - AttributeName: sequence_number
          AttributeType: N
      KeySchema:
        - AttributeName: audit_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: SequenceIndex
          KeySchema:
            - AttributeName: sequence_number
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # ─── 3. EVENTBRIDGE EVENT BUS & ROUTING RULES ────────────────────────────
  ResiliaEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub ResiliaEventBus-${Environment}

  ResiliaDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub resilia-dlq-${Environment}
      MessageRetentionPeriod: 1209600 # 14 days
      KmsMasterKeyId: alias/aws/sqs

  CriticalTelemetryRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub Resilia-CriticalTelemetryRule-${Environment}
      Description: Routes CRITICAL and HIGH severity telemetry alerts
      EventBusName: !Ref ResiliaEventBus
      EventPattern:
        source:
          - resilia.telemetry
        detail-type:
          - OperationalTelemetry
        detail:
          severity:
            - CRITICAL
            - HIGH
      State: ENABLED
      Targets:
        - Arn: !GetAtt ResiliaDeadLetterQueue.Arn
          Id: ResiliaDeadLetterQueueTarget

  # ─── 4. AWS STEP FUNCTIONS STATE MACHINE ─────────────────────────────────
  StepFunctionsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/vendedlogs/states/ResiliaInterventionPipeline-${Environment}
      RetentionInDays: 30

  ResiliaInterventionStateMachineRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ResiliaStepFunctionsExecutionPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                Resource:
                  - !GetAtt InventoryTable.Arn
                  - !GetAtt AuditLedgerTable.Arn
              - Effect: Allow
                Action:
                  - events:PutEvents
                Resource: !GetAtt ResiliaEventBus.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogDelivery
                  - logs:GetLogDelivery
                  - logs:UpdateLogDelivery
                  - logs:DeleteLogDelivery
                  - logs:ListLogDeliveries
                  - logs:PutResourcePolicy
                  - logs:DescribeResourcePolicies
                  - logs:DescribeLogGroups
                Resource: "*"

  ResiliaInterventionPipeline:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub ResiliaInterventionPipeline-${Environment}
      RoleArn: !GetAtt ResiliaInterventionStateMachineRole.Arn
      LoggingConfiguration:
        Level: ALL
        IncludeExecutionData: true
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt StepFunctionsLogGroup.Arn
      DefinitionString: !Sub |
        {
          "Comment": "RESILIA Human-Governed Intervention Execution Pipeline with Idempotency and Audit Integrity",
          "StartAt": "ValidateHumanApproval",
          "States": {
            "ValidateHumanApproval": {
              "Type": "Choice",
              "Comment": "Enforce strict human-in-the-loop governance: unapproved interventions must not proceed",
              "Choices": [
                {
                  "And": [
                    {
                      "Variable": "$.approval.status",
                      "StringEquals": "APPROVED"
                    },
                    {
                      "Variable": "$.approval.approved_by",
                      "IsPresent": true
                    }
                  ],
                  "Next": "CheckExecutionIdempotency"
                }
              ],
              "Default": "InterventionHaltedUnapproved"
            },
            "InterventionHaltedUnapproved": {
              "Type": "Fail",
              "Error": "HumanApprovalRequired",
              "Cause": "Execution halted: Intervention lacks authorized human signature (DHO/National Commander)."
            },
            "CheckExecutionIdempotency": {
              "Type": "Task",
              "Resource": "arn:aws:states:::dynamodb:getItem",
              "Comment": "Verify intervention execution key has not been processed previously",
              "Parameters": {
                "TableName": "${AuditLedgerTable}",
                "Key": {
                  "audit_id": {
                    "S.$": "$.idempotency_key"
                  }
                }
              },
              "ResultPath": "$.idempotency_record",
              "Next": "EvaluateIdempotencyResult"
            },
            "EvaluateIdempotencyResult": {
              "Type": "Choice",
              "Choices": [
                {
                  "Variable": "$.idempotency_record.Item",
                  "IsPresent": true,
                  "Next": "InterventionAlreadyExecuted"
                }
              ],
              "Default": "DebitDonorInventory"
            },
            "InterventionAlreadyExecuted": {
              "Type": "Fail",
              "Error": "DuplicateExecutionKey",
              "Cause": "Idempotent execution guard: Intervention transaction was previously executed and committed."
            },
            "DebitDonorInventory": {
              "Type": "Task",
              "Resource": "arn:aws:states:::dynamodb:updateItem",
              "Comment": "Atomically debit source PHC inventory with safety-stock balance condition",
              "Parameters": {
                "TableName": "${InventoryTable}",
                "Key": {
                  "phc_id": {
                    "S.$": "$.donor_phc_id"
                  },
                  "medicine_code": {
                    "S.$": "$.medicine_code"
                  }
                },
                "UpdateExpression": "SET quantity = quantity - :transfer_qty",
                "ConditionExpression": "quantity >= :transfer_qty",
                "ExpressionAttributeValues": {
                  ":transfer_qty": {
                    "N.$": "$.quantity_str"
                  }
                }
              },
              "ResultPath": "$.donor_debit_result",
              "Catch": [
                {
                  "ErrorEquals": ["DynamoDB.ConditionalCheckFailedException"],
                  "Next": "InsufficientDonorInventoryHalt"
                }
              ],
              "Next": "CreditRecipientInventory"
            },
            "InsufficientDonorInventoryHalt": {
              "Type": "Fail",
              "Error": "InsufficientInventory",
              "Cause": "Donor PHC stock insufficient to fulfill transfer without breaching safety reserves."
            },
            "CreditRecipientInventory": {
              "Type": "Task",
              "Resource": "arn:aws:states:::dynamodb:updateItem",
              "Comment": "Credit recipient PHC inventory",
              "Parameters": {
                "TableName": "${InventoryTable}",
                "Key": {
                  "phc_id": {
                    "S.$": "$.recipient_phc_id"
                  },
                  "medicine_code": {
                    "S.$": "$.medicine_code"
                  }
                },
                "UpdateExpression": "SET quantity = quantity + :transfer_qty",
                "ExpressionAttributeValues": {
                  ":transfer_qty": {
                    "N.$": "$.quantity_str"
                  }
                }
              },
              "ResultPath": "$.recipient_credit_result",
              "Next": "PublishDispatchEvent"
            },
            "PublishDispatchEvent": {
              "Type": "Task",
              "Resource": "arn:aws:states:::events:putEvents",
              "Comment": "Publish immutable INTERVENTION_DISPATCHED event to EventBridge",
              "Parameters": {
                "Entries": [
                  {
                    "EventBusName": "${ResiliaEventBus}",
                    "Source": "resilia.intervention",
                    "DetailType": "InterventionDispatched",
                    "Detail.$": "States.JsonToString($.intervention_summary)"
                  }
                ]
              },
              "ResultPath": "$.event_result",
              "Next": "RecordImmutableAuditEntry"
            },
            "RecordImmutableAuditEntry": {
              "Type": "Task",
              "Resource": "arn:aws:states:::dynamodb:putItem",
              "Comment": "Commit SHA-256 cryptographic audit ledger entry to DynamoDB",
              "Parameters": {
                "TableName": "${AuditLedgerTable}",
                "Item": {
                  "audit_id": {
                    "S.$": "$.idempotency_key"
                  },
                  "action_type": {
                    "S": "INTERVENTION_EXECUTED"
                  },
                  "actor_id": {
                    "S.$": "$.approval.approved_by"
                  },
                  "actor_role": {
                    "S.$": "$.approval.role"
                  },
                  "sha256_hash": {
                    "S.$": "$.audit_hash"
                  },
                  "timestamp": {
                    "S.$": "$.approval.approved_at"
                  }
                }
              },
              "ResultPath": "$.audit_result",
              "End": true
            }
          }
        }

  # ─── 5. AMAZON COGNITO AUTHENTICATION & RBAC ─────────────────────────────
  ResiliaUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub Resilia-Users-${Environment}
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false

  ResiliaUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub resilia-client-${Environment}
      UserPoolId: !Ref ResiliaUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  # User Groups for Fine-Grained Cedar RBAC
  DistrictHealthOfficerGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: DistrictHealthOfficers
      Description: Authorized DHOs with intervention approval authority
      UserPoolId: !Ref ResiliaUserPool

  PHCPharmacistGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: PHCPharmacists
      Description: Local health staff reporting stock counts
      UserPoolId: !Ref ResiliaUserPool

  NationalCommanderGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: NationalCommanders
      Description: Ministry of Health senior resilience directors
      UserPoolId: !Ref ResiliaUserPool

  # ─── 6. API GATEWAY HTTP API ─────────────────────────────────────────────
  ResiliaHttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub Resilia-HttpApi-${Environment}
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins: ["*"]
        AllowMethods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
        AllowHeaders: ["*"]

Outputs:
  ApiEndpoint:
    Description: HTTP API Gateway Base URL
    Value: !GetAtt ResiliaHttpApi.ApiEndpoint

  EventBusArn:
    Description: Amazon EventBridge ResiliaEventBus ARN
    Value: !GetAtt ResiliaEventBus.Arn

  StateMachineArn:
    Description: AWS Step Functions State Machine ARN
    Value: !GetAtt ResiliaInterventionPipeline.Arn

  CognitoUserPoolId:
    Description: AWS Cognito User Pool ID
    Value: !Ref ResiliaUserPool
